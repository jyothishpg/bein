<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bein</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body>
    <div class="admin-wrapper">
        <div class="container-fluid">
            <div class="row">
                <div class="col-lg-6">
                    <div class="quick-actions">
                        <div class="d-flex justify-content-between align-items-center">
                            <a href="#" class="cancel">Cancel</a>
                            <a href="#" class="edit">Portfolio <i class="bi bi-pencil-fill"></i></a>
                            <a href="#" class="save">Save</a>
                        </div>
                    </div>
                    <div class="file-upload-wrapper">
                        <img src="images/upload-thumb.png" alt="" class="file-thumb">
                        <h6>Upload Images </h6>
                        <p>Maximum Height 778 Pixels and Width 393 Pixles</p>
                        <input type="file" id="file-upload" hidden />

                        <!-- Styled label acting as the upload button -->
                        <label for="file-upload" class="fileupload-btn">
                        <i class="bi bi-upload"></i> Upload Images
                        </label>
                    </div>
                    <div class="form-wrapper">
                        <form>
                            <div class="row">
                                <div class="col-sm-12">
                                    <input type="text" class="form-control" id="" aria-describedby="" placeholder="Title*">
                                </div>
                                <div class="col-sm-12">
                                    <input type="text" class="form-control" id="" aria-describedby="" placeholder="Sub Title*">
                                </div>
                                <div class="col-sm-12">
                                    <textarea name="" rows="6" class="form-control" id="" placeholder="Description*"></textarea>
                                </div>
                            </div>
                          </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
